<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bell tile preview</title>
<style>
    /* theme variables as the Symcon tile visualization sets them */
    body { margin: 0; font-family: -apple-system, sans-serif; --accent-color: #00cdab; --content-color: #e8eef5; --card-color: #1b2531; background: var(--card-color); color: var(--content-color); }
    body.light { --content-color: #000000; --card-color: #ffffff; }
    #log { font: 12px monospace; padding: 8px; opacity: 0.8; white-space: pre-wrap; }
    #tile { height: 340px; width: 380px; margin: 8px; border: 1px solid #556; border-radius: 10px; }
    #bar { padding: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    /* stand-in for the Symcon icons (icons.js is only available in Symcon) */
    #tile i[class*="fa-"]::before { content: '\25CF'; font-style: normal; }
</style>
</head>
<body>
<!-- Local preview of DoorstationBell/module.html with SDK stubs.
     Serve the repo root: ../tools/php/php -S 127.0.0.1:8765 and open /tests/tile-preview-bell.html -->
<div id="bar">
    <button onclick="document.body.classList.toggle('light')">hell/dunkel</button>
    <button onclick="document.getElementById('tile').style.height = document.getElementById('tile').style.height === '120px' ? '340px' : '120px'">klein/groß</button>
    <button onclick="show({})">Ein, leer</button>
    <button onclick="show({ muted: true, mailbox: 1 })">stumm, Post</button>
    <button onclick="show({ pending: true, mailbox: 2 })">wartet, Zeitung</button>
    <button onclick="show({ motion: true, mailbox: 1 })">Bewegung</button>
    <button onclick="show({ motion: null, motion_var: null, mailbox: null, rings: [] })">nur Klingel</button>
</div>
<div id="tile"></div>
<div id="log"></div>
<script>
    const log = (text) => { document.getElementById('log').textContent += text + '\n'; };
    let de = {};
    window.translate = (text) => de[text] || text;
    window.requestAction = (ident, value) => log('requestAction(' + ident + ', ' + value + ')');
    window.openObject = (id) => log('openObject(' + id + ')');
    const now = Math.floor(Date.now() / 1000);
    const sample = {
        muted: false,
        pending: false,
        motion: false,
        last_motion: now - 1800,
        ring_var: 12345,
        motion_var: 23456,
        mailbox: 0,
        rings: [
            { time: now - 120, muted: false },
            { time: now - 90000, muted: true },
            { time: now - 200000, muted: false },
        ],
    };
    const show = (change) => handleMessage(JSON.stringify(Object.assign({}, sample, change)));
    Promise.all([fetch('../DoorstationBell/module.html').then((r) => r.text()), fetch('../DoorstationBell/locale.json').then((r) => r.json())])
        .then(([html, locale]) => {
            de = locale.translations.de;
            const tile = document.getElementById('tile');
            tile.innerHTML = html;
            tile.querySelectorAll('script').forEach((old) => {
                const s = document.createElement('script');
                s.textContent = old.textContent;
                old.replaceWith(s);
            });
            show({});
        });
</script>
</body>
</html>
