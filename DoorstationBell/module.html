<script src="/icons.js"></script>
<style>
    /* Theme colors of the tile visualization (--content-color, --accent-color), as in the access tile */
    #dsb {
        --dsb-text: var(--content-color, inherit);
        --dsb-accent: var(--accent-color, #00CDAB);
        --dsb-line: rgba(127, 127, 127, 0.25);
        --dsb-line: color-mix(in srgb, var(--content-color, #7F7F7F) 20%, transparent);
        --dsb-border: rgba(127, 127, 127, 0.5);
        --dsb-border: color-mix(in srgb, var(--content-color, #7F7F7F) 40%, transparent);
        font-family: inherit; color: var(--dsb-text); height: 100%; box-sizing: border-box; padding: 8px 12px; overflow: auto;
    }
    #dsb .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    #dsb .title { font-weight: 600; flex: 1; }
    #dsb button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--dsb-border); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
    #dsb button:hover:not(:disabled), #dsb button:focus-visible { border-color: var(--dsb-accent); color: var(--dsb-accent); outline: none; }
    #dsb button:disabled { cursor: default; }
    #dsb .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--dsb-line); }
    #dsb .row > i { width: 1.4em; text-align: center; flex: none; }
    #dsb .row .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #dsb .row .value { opacity: 0.75; white-space: nowrap; }
    #dsb .ring { padding-left: calc(1.4em + 8px); }
    #dsb .segment { display: flex; flex: none; }
    #dsb .segment button { border-radius: 0; }
    #dsb .segment button:first-child { border-radius: 6px 0 0 6px; }
    #dsb .segment button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
    #dsb .segment button.active { background: var(--dsb-accent); border-color: var(--dsb-accent); color: var(--card-color, #FFFFFF); }
    #dsb .segment.pending { opacity: 0.5; }
    #dsb button.full { background: var(--dsb-accent); border-color: var(--dsb-accent); color: var(--card-color, #FFFFFF); }
    #dsb .hint, #dsb .error { padding: 6px 0; }
    #dsb .error { color: #E53935; }
    #dsb .compact { display: none; border-top: none; }
    body.small #dsb .full-view { display: none; }
    body.small #dsb .compact { display: flex; }
</style>

<div id="dsb">
    <div class="head">
        <i class="fa-light fa-bell"></i>
        <span class="title" id="title"></span>
    </div>
    <div class="error" id="error" hidden></div>
    <div class="row compact" id="compact"></div>
    <div class="full-view" id="content"></div>
</div>

<script>
    if (typeof translate !== 'function') { window.translate = (text) => text; }

    let state = null;
    let errorTimer = null;

    const mailboxText = [translate('Empty'), translate('Mail'), translate('Newspaper')];

    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    }

    function button(label, onClick) {
        const b = el('button', '', label);
        b.type = 'button';
        b.addEventListener('click', onClick);
        return b;
    }

    function formatTime(seconds) {
        const d = new Date(seconds * 1000);
        const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        if (d.toDateString() === new Date().toDateString()) return translate('Today') + ' ' + hm;
        return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '. ' + hm;
    }

    function row(iconClass, label) {
        const r = el('div', 'row');
        r.appendChild(el('i', iconClass));
        r.appendChild(el('span', 'label', label));
        return r;
    }

    // Muted | On; while the doorstation has not confirmed, dimmed and locked
    function ringtoneRow() {
        const r = row('fa-light fa-volume-high', translate('Ringtone'));
        const segment = el('div', 'segment' + (state.pending ? ' pending' : ''));
        [[true, translate('Muted')], [false, translate('On')]].forEach(([muted, label]) => {
            const b = button(label, () => requestAction('SetMuted', JSON.stringify(muted)));
            if (state.muted === muted) b.classList.add('active');
            b.disabled = state.pending || state.muted === muted;
            segment.appendChild(b);
        });
        r.appendChild(segment);
        return r;
    }

    function ringRows() {
        const rows = [row('fa-light fa-clock-rotate-left', translate('Last rings'))];
        if (state.rings.length === 0) {
            rows.push(el('div', 'row ring hint', translate('No rings yet')));
        }
        state.rings.forEach((ring) => {
            const r = el('div', 'row ring');
            r.appendChild(el('span', 'label', formatTime(ring.time)));
            r.appendChild(el('span', 'value', ring.muted ? translate('muted') : ''));
            rows.push(r);
        });
        return rows;
    }

    function motionRow() {
        const r = row('fa-light fa-person-walking', translate('Motion'));
        const now = state.motion ? translate('Motion') : translate('No motion');
        const last = state.last_motion ? ' · ' + formatTime(state.last_motion) : '';
        r.appendChild(el('span', 'value', now + last));
        return r;
    }

    // Empty, Mail or Newspaper; a tap empties it (e.g. after pulling out a newspaper)
    function mailboxRow() {
        const r = row('fa-light fa-envelope', translate('Mailbox'));
        const b = button(mailboxText[state.mailbox] || mailboxText[0], () => requestAction('ResetMailbox', ''));
        b.disabled = state.mailbox === 0;
        if (state.mailbox !== 0) b.classList.add('full');
        r.appendChild(b);
        return r;
    }

    // Small tile: last ring and an envelope when there is mail
    function renderCompact() {
        const box = document.getElementById('compact');
        box.replaceChildren();
        box.appendChild(el('i', 'fa-light fa-bell'));
        box.appendChild(el('span', 'label', state.rings.length ? formatTime(state.rings[0].time) : translate('No rings yet')));
        if (state.mailbox) box.appendChild(el('i', 'fa-light fa-envelope'));
    }

    function render() {
        if (!state) return;
        document.getElementById('title').textContent = translate('Bell');
        const content = document.getElementById('content');
        content.replaceChildren();
        content.appendChild(ringtoneRow());
        ringRows().forEach((r) => content.appendChild(r));
        if (state.motion !== null) content.appendChild(motionRow());
        if (state.mailbox !== null) content.appendChild(mailboxRow());
        renderCompact();
    }

    function showError(text) {
        const box = document.getElementById('error');
        box.textContent = text;
        box.hidden = false;
        clearTimeout(errorTimer);
        errorTimer = setTimeout(() => { box.hidden = true; }, 5000);
    }

    function handleMessage(data) {
        const message = typeof data === 'string' ? JSON.parse(data) : data;
        if (message.error) {
            showError(message.error);
            return;
        }
        state = message;
        render();
    }

    if (typeof ResizeObserver === 'function') {
        new ResizeObserver(() => document.body.classList.toggle('small', document.body.clientHeight < 160)).observe(document.body);
    }
</script>
