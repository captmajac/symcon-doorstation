<script src="/icons.js"></script>
<style>
    /* Theme colors of the tile visualization (--content-color, --accent-color); Symcon has no green/red, these stay fixed */
    #dsa {
        --dsa-text: var(--content-color, inherit);
        --dsa-accent: var(--accent-color, #00CDAB);
        --dsa-line: rgba(127, 127, 127, 0.25);
        --dsa-line: color-mix(in srgb, var(--content-color, #7F7F7F) 20%, transparent);
        --dsa-border: rgba(127, 127, 127, 0.5);
        --dsa-border: color-mix(in srgb, var(--content-color, #7F7F7F) 40%, transparent);
        --dsa-ok: #43A047;
        --dsa-warn: #FDD835;
        --dsa-bad: #E53935;
        font-family: inherit; color: var(--dsa-text); height: 100%; box-sizing: border-box; padding: 8px 12px; overflow: auto;
    }
    #dsa .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    #dsa .title { font-weight: 600; flex: 1; }
    #dsa .dot { width: 10px; height: 10px; border-radius: 50%; display: none; flex: none; }
    #dsa .dot.online { display: inline-block; background: var(--dsa-ok); }
    #dsa .dot.degraded { display: inline-block; background: var(--dsa-warn); }
    #dsa .dot.offline { display: inline-block; background: var(--dsa-bad); }
    #dsa button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--dsa-border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
    #dsa button:hover, #dsa button:focus-visible { border-color: var(--dsa-accent); color: var(--dsa-accent); outline: none; }
    #dsa button.icon { width: 2.4em; padding: 2px 0; text-align: center; flex: none; }
    #dsa input[type=text] { font: inherit; color: inherit; background: transparent; border: 1px solid var(--dsa-border); border-radius: 6px; padding: 2px 6px; min-width: 0; flex: 1; }
    #dsa input[type=text]:focus { border-color: var(--dsa-accent); outline: none; }
    #dsa input[type=checkbox] { accent-color: var(--dsa-accent); }
    #dsa .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--dsa-line); }
    #dsa .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #dsa .row .time { opacity: 0.75; white-space: nowrap; }
    #dsa .last { border-top: none; }
    #dsa .allowed { color: var(--dsa-ok); opacity: 1; }
    #dsa .denied { color: var(--dsa-bad); opacity: 1; }
    #dsa .hint, #dsa .error { padding: 6px 0; }
    #dsa .error { color: var(--dsa-bad); }
    body.small #dsa .older, body.small #dsa #toggle { display: none; }
</style>

<div id="dsa">
    <div class="head">
        <span class="dot" id="dot"></span>
        <span class="title" id="title"></span>
        <button id="toggle" class="icon" type="button"><i id="toggleIcon"></i></button>
    </div>
    <div class="error" id="error" hidden></div>
    <div id="recent"></div>
    <div id="manage" hidden></div>
</div>

<script>
    if (typeof translate !== 'function') { window.translate = (text) => text; }

    let state = null;
    let manage = false;
    let editing = null;  // 'recent:<index>' or 'key:<id>' of the row whose name is being entered
    let errorTimer = null;

    const hints = {
        unknown: translate('unknown'),
        inactive: translate('inactive'),
        outside_schedule: translate('outside schedule'),
        stale: translate('discarded (too old)'),
    };

    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    }

    function button(label, onClick, iconClass) {
        const b = el('button');
        b.type = 'button';
        if (iconClass) {
            b.classList.add('icon');
            b.appendChild(el('i', iconClass));
            b.title = label;
        } else {
            b.textContent = label;
        }
        b.addEventListener('click', onClick);
        return b;
    }

    function formatTime(seconds) {
        const d = new Date(seconds * 1000);
        const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        if (d.toDateString() === new Date().toDateString()) return translate('Today') + ' ' + hm;
        return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '. ' + hm;
    }

    function shortId(id) {
        return id.length > 16 ? id.slice(0, 16) + '…' : id;
    }

    function keyById(id) {
        return state.keys.find((k) => k.id === id) || null;
    }

    function nameInput(id, initial, action) {
        const input = el('input');
        input.type = 'text';
        input.maxLength = 40;
        input.value = initial;
        input.placeholder = translate('Name');
        const save = () => {
            const value = JSON.stringify({ id: id, name: input.value });
            if (action === 'CreateKey') requestAction('CreateKey', value);
            else requestAction('RenameKey', value);
        };
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') save();
            if (e.key === 'Escape') { editing = null; render(); }
        });
        setTimeout(() => input.focus(), 0);
        return [input, button(action === 'CreateKey' ? translate('Create') : translate('Save'), save)];
    }

    function recentRow(entry, index) {
        const row = el('div', 'row' + (index === 0 ? ' last' : ' older'));
        if (entry.result !== null && entry.result !== 'allowed') {
            row.title = hints[entry.result] || entry.result;
        }

        row.appendChild(el('i', entry.type === 'homekey' ? 'fa-light fa-mobile' : 'fa-light fa-id-card'));
        if (editing === 'recent:' + index && entry.name === null) {
            nameInput(entry.id, '', 'CreateKey').forEach((n) => row.appendChild(n));
            return row;
        }
        // unknown keys by ID so several can be told apart
        const name = el('span', 'name', entry.name !== null ? entry.name : shortId(entry.id));
        name.title = entry.id;
        row.appendChild(name);
        // only the time shows the result
        const result = entry.result === null ? '' : entry.result === 'allowed' ? ' allowed' : ' denied';
        row.appendChild(el('span', 'time' + result, formatTime(entry.time)));

        const key = keyById(entry.id);
        if (key) {
            row.appendChild(button(translate('Schedule'), () => openObject(key.event), 'fa-light fa-clock'));
        } else {
            row.appendChild(button(translate('Name key'), () => { editing = 'recent:' + index; render(); }, 'fa-light fa-plus'));
        }
        return row;
    }

    function keyRow(key) {
        const row = el('div', 'row');
        if (editing === 'key:' + key.id) {
            nameInput(key.id, key.name, 'RenameKey').forEach((n) => row.appendChild(n));
            return row;
        }
        const name = el('span', 'name', key.name);
        name.title = (key.allowed_now ? translate('Access now') : translate('Locked now')) + ' · ' + key.id;
        const now = el('span', 'dot ' + (key.allowed_now ? 'online' : 'offline'));
        now.title = name.title;
        row.appendChild(now);
        row.appendChild(name);

        const active = el('input');
        active.type = 'checkbox';
        active.checked = key.active;
        active.title = translate('Active');
        active.addEventListener('change', () => requestAction('SetKeyActive', JSON.stringify({ id: key.id, active: active.checked })));
        row.appendChild(active);
        row.appendChild(button(translate('Rename'), () => { editing = 'key:' + key.id; render(); }, 'fa-light fa-pen'));
        row.appendChild(button(translate('Schedule'), () => openObject(key.event), 'fa-light fa-clock'));
        row.appendChild(button(translate('Delete'), () => {
            if (confirm(translate('Delete key?') + ' ' + key.name)) {
                requestAction('DeleteKey', JSON.stringify({ id: key.id }));
            }
        }, 'fa-light fa-trash'));
        return row;
    }

    function render() {
        if (!state) return;
        document.getElementById('title').textContent = translate('Entry');
        const dot = document.getElementById('dot');
        dot.className = 'dot' + (state.status ? ' ' + state.status : '');
        dot.title = state.status ? translate('Reader') + ': ' + state.status : '';
        document.getElementById('toggle').title = manage ? translate('Back') : translate('Manage keys');
        document.getElementById('toggleIcon').className = manage ? 'fa-light fa-arrow-left' : 'fa-light fa-gear';

        const recent = document.getElementById('recent');
        recent.innerHTML = '';
        recent.hidden = manage;
        if (!manage) {
            state.recent.forEach((entry, i) => recent.appendChild(recentRow(entry, i)));
        }

        const list = document.getElementById('manage');
        list.innerHTML = '';
        list.hidden = !manage;
        if (manage) {
            if (state.keys.length === 0) list.appendChild(el('div', 'hint', translate('No keys yet')));
            [...state.keys].sort((a, b) => a.name.localeCompare(b.name)).forEach((key) => list.appendChild(keyRow(key)));
        }
    }

    function showError(text) {
        const box = document.getElementById('error');
        box.textContent = text;
        box.hidden = false;
        clearTimeout(errorTimer);
        errorTimer = setTimeout(() => { box.hidden = true; }, 5000);
    }

    function handleMessage(data) {
        const message = typeof data === 'string' ? JSON.parse(data) : data;
        if (message.error) {
            showError(message.error);
            return;
        }
        state = message;
        editing = null;
        render();
    }

    document.getElementById('toggle').addEventListener('click', () => { manage = !manage; editing = null; render(); });

    if (typeof ResizeObserver === 'function') {
        new ResizeObserver(() => document.body.classList.toggle('small', document.body.clientHeight < 160)).observe(document.body);
    }
</script>
